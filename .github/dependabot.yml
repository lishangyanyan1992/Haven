version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "05:00"
      timezone: "America/Chicago"
    # Disable routine version-update PRs so Dependabot only opens security PRs
    # (note: security updates can still include breaking major bumps).
    open-pull-requests-limit: 0
    ignore:
      # Next.js 16's build-time type checking still requires TypeScript's
      # JavaScript API, which is no longer exposed by TypeScript 7.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-security:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "05:30"
      timezone: "America/Chicago"
    groups:
      github-actions:
        patterns:
          - "*"
